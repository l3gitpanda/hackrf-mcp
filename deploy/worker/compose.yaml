# The split station's worker: three services from one image, sharing /data
# (the live log, spectrum history, captures, web state, and the live
# service's control and feed sockets). The HackRF is on another machine
# behind hackrf-agent (deploy/hackrf-agent.service).
#
#   cp deploy/worker/worker.env.example /opt/hackrf/worker.env   # then edit
#   put the agent's token in /opt/hackrf/agent-token (mode 0400, uid 1000)
#   HACKRF_LIVE_AGENT=<agent host>:8767 docker compose -f deploy/worker/compose.yaml up -d
#   (or put HACKRF_LIVE_AGENT in a .env file beside the compose file)
#
# Ports: 8765 (MCP, bearer token) and 8766 (web UI, token then cookie).
# Allow them to the LAN only; there is no TLS.

name: hackrf

x-worker: &worker
  image: ${HACKRF_IMAGE:-192.168.3.130:3000/panda/hackrf-mcp:homelab}
  user: "1000:1000"
  restart: unless-stopped
  env_file: ${HACKRF_ENV_FILE:-/opt/hackrf/worker.env}
  volumes:
    - hackrf-data:/data
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  live:
    <<: *worker
    command: ["python", "-m", "hackrf_mcp.live_service"]
    volumes:
      - hackrf-data:/data
      - ${HACKRF_AGENT_TOKEN:-/opt/hackrf/agent-token}:/run/secrets/agent-token:ro
    environment:
      # The hackrf-agent next to the HackRF. Set for live and mcp only, not in
      # worker.env: a service given the address must also get the token file
      # or it refuses to start, and web needs neither.
      HACKRF_LIVE_AGENT: ${HACKRF_LIVE_AGENT:?set HACKRF_LIVE_AGENT to the agent's host:port}
      HACKRF_LIVE_AGENT_TOKEN_FILE: /run/secrets/agent-token
    # The decoders and the spectrum FFTs: the part that needed more CPU
    # than the box with the radio has.
    cpus: 4
    mem_limit: 2g

  web:
    <<: *worker
    command: ["python", "-m", "hackrf_mcp.web"]
    depends_on: [live]
    environment:
      HACKRF_WEB_HOST: 0.0.0.0
      HACKRF_WEB_PORT: "8766"
      # Alerts can post their hits to a webhook. Its URL is a secret: keep
      # it in a file only this service mounts (owned by, or readable to,
      # uid 1000), and add that file to this service's volumes below.
      # HACKRF_WEB_ALERT_WEBHOOK_FILE: /run/secrets/alert-webhook
      # HACKRF_WEB_ALERT_WEBHOOK_FORMAT: discord   # json (default), discord or ntfy
      # HACKRF_WEB_URL: http://192.0.2.10:8766      # for links in the messages
      # Aircraft classes on the Map (military, law enforcement, ...): download
      # the FAA registry and plane-alert-db weekly (about 75 MB each time).
      # HACKRF_WEB_AIRCRAFT_DB: weekly
    # volumes:
    #   - hackrf-data:/data
    #   - ./alert-webhook:/run/secrets/alert-webhook:ro
    ports:
      - "8766:8766"
    cpus: 1
    mem_limit: 512m

  mcp:
    <<: *worker
    command: ["hackrf-mcp", "--transport", "http"]
    depends_on: [live]
    environment:
      HACKRF_MCP_HOST: 0.0.0.0
      HACKRF_MCP_PORT: "8765"
      # hackrf_info, hackrf_sweep and captures run through the agent.
      HACKRF_LIVE_AGENT: ${HACKRF_LIVE_AGENT:?set HACKRF_LIVE_AGENT to the agent's host:port}
      HACKRF_LIVE_AGENT_TOKEN_FILE: /run/secrets/agent-token
    volumes:
      - hackrf-data:/data
      - ${HACKRF_AGENT_TOKEN:-/opt/hackrf/agent-token}:/run/secrets/agent-token:ro
    ports:
      - "8765:8765"
    cpus: 2
    mem_limit: 1g

volumes:
  hackrf-data:
