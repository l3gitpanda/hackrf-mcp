<!doctype html>
<html lang="en">
<head>

<title>Live on a tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hl.css">
</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#0a0e13}</style>
</helmet>
<div style="width: 834px; min-height: 1640px; background: #0a0e13">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1640}}'>

// move the nav to its own row and raise touch targets to 40 px.
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
