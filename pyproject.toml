[project]
name = "hackrf-mcp"
version = "0.1.0"
description = "MCP server that wraps the hackrf_tools CLI to control a HackRF SDR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
]

[project.scripts]
hackrf-mcp = "hackrf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackrf_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
